<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1B3D">
<meta name="mobile-web-app-capable" content="yes">
<title>מפלצת הראשים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="title" class="screen" hidden>
  <div class="title-inner">
    <div id="titleLogo" class="logo">מפלצת <span>הראשים!</span></div>
    <div class="lair">
      <canvas id="titleHero" class="hero" aria-hidden="true"></canvas>
      <div class="lair-bar"><div id="headCount" class="head-count"></div><div id="slots" class="slots"></div></div>
    </div>
    <div class="chars-box">
      <div id="chars" class="chars"></div>
      <div id="charPerk" class="perk"></div>
    </div>
    <button id="playBtn" class="btn big">שחק!</button>
    <button id="shopBtn" class="btn alt shop-btn">החנות <span id="titleCoins" class="coin-pill"></span></button>
  </div>
  <button id="muteBtn" class="icon-btn corner" aria-label="צליל">🔊</button>
  <button id="settingsBtn" class="icon-btn corner end" aria-label="הגדרות">⚙️</button>
  <div id="settings" class="overlay" hidden>
    <div class="panel">
      <h2>הגדרות</h2>
      <div id="resetAsk" class="settings-step">
        <button id="resetBtn" class="btn alt">איפוס התקדמות</button>
        <button id="settingsClose" class="btn">סגירה</button>
      </div>
      <div id="resetConfirm" class="settings-step" hidden>
        <p class="warn">בטוחים? כל הכוכבים, השלבים והראשים שגדלו יימחקו, ואי אפשר לבטל את זה.</p>
        <button id="resetYes" class="btn danger">כן, לאפס הכול</button>
        <button id="resetNo" class="btn alt">ביטול</button>
      </div>
      <p id="resetDone" class="done" hidden>ההתקדמות אופסה. מתחילים מההתחלה!</p>
    </div>
  </div>
</section>

<section id="shop" class="screen" hidden>
  <header class="shop-head">
    <h1>החנות</h1>
    <span id="shopCoins" class="coin-pill big"></span>
  </header>
  <div class="shop-tabs" role="tablist">
    <button class="tab" data-tab="heads">ראשים</button>
    <button class="tab" data-tab="specials">כוחות מיוחדים</button>
  </div>
  <div id="shopList" class="shop-list"></div>
  <button id="shopBack" class="home-btn" aria-label="חזרה">
    <svg class="ic" viewBox="0 0 48 48"><path d="M18 10 L32 24 L18 38" fill="none" stroke="#FFDE95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</section>

<section id="map" class="screen" hidden>
  <header class="top-bar">
    <h1>העולמות</h1>
    <button id="mapShop" class="map-shop">החנות <span id="mapCoins" class="coin-pill"></span></button>
  </header>
  <div id="worldList" class="world-list"></div>
  <button id="mapBack" class="home-btn" aria-label="למסך הראשי">
    <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
  </button>
</section>

<section id="world" class="screen" hidden>
  <div class="world-hero">
    <img id="worldBanner" class="world-banner" alt="">
    <img id="worldBoss" class="world-boss" alt="">
    <div id="worldPrize" class="world-prize"></div>
    <div class="world-title"><span id="worldNum"></span><h1 id="worldName"></h1><span id="worldStars" class="world-stars"></span></div>
  </div>
  <div id="levelList" class="level-list"></div>
  <button id="worldBack" class="home-btn" aria-label="לכל העולמות">
    <svg class="ic" viewBox="0 0 48 48"><path d="M18 10 L32 24 L18 38" fill="none" stroke="#FFDE95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</section>

<section id="game" class="screen hydra" hidden>
  <div class="hud">
    <button id="pauseBtn" class="icon-btn small" aria-label="הפסקה">❚❚</button>
    <div id="lives" class="lives"></div>
    <div class="level-box">
      <div id="levelName" class="level-name"></div>
      <div id="timer" class="timer">⏱ <bdi id="timerNum">0:00</bdi></div>
    </div>
  </div>
  <div id="boardWrap" class="board-wrap">
    <canvas id="hcv"></canvas>
    <div id="banner" class="banner" hidden></div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="panel pause-panel">
      <div class="pause-nap" aria-hidden="true"><img id="pauseDino" alt=""><span class="zz">z<i>z</i><b>z</b></span></div>
      <button id="ctrlInfoBtn" class="info-btn" aria-label="איך משחקים">i</button>
      <h2>הפסקה</h2>
      <button id="resumeBtn" class="btn resume">
        <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M15 9 L39 24 L15 39 Z"/></svg>
        ממשיכים
      </button>
      <div class="pause-grid">
        <button id="restartBtn" class="ptile t-restart">
          <svg class="ic" viewBox="0 0 48 48"><path class="o" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="i" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="fill" d="M38.6 20 L43 31.5 L30 27.5 Z"/></svg>
          <span>מחדש</span>
        </button>
        <button id="pauseMapBtn" class="ptile t-map">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill paper" d="M5 12 L17 8 L31 12 L43 8 L43 36 L31 40 L17 36 L5 40 Z"/><path class="line" d="M17 8 V36 M31 12 V40"/><path class="dash" d="M10 33 Q16 22 24 26 T34 19"/><path class="x" d="M33 15 L39 21 M39 15 L33 21"/></svg>
          <span>מפה</span>
        </button>
        <button id="pauseHomeBtn" class="ptile t-home">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
          <span>בית</span>
        </button>
      </div>
      <div class="pause-row">
        <button id="pauseMuteBtn" class="round-toggle" aria-label="צליל">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M7 19 H15 L26 10 V38 L15 29 H7 Z"/><g class="on-only"><path class="line" d="M31 18 Q35 24 31 30"/><path class="line" d="M35 13 Q43 24 35 35"/></g><path class="x off-only" d="M32 19 L42 29 M42 19 L32 29"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="ctrlInfo" class="overlay" hidden>
    <div class="panel ctrl-panel">
      <h2>איך משחקים</h2>
      <ul id="ctrlList" class="ctrl-list"></ul>
      <button id="ctrlInfoClose" class="btn">הבנתי!</button>
    </div>
  </div>

  <div id="win" class="overlay" hidden>
    <div class="panel pause-panel win-panel">
      <div class="pause-nap" aria-hidden="true"><img id="winHero" alt=""></div>
      <h2 id="winTitle">כל הכבוד!</h2>
      <div id="winStars" class="stars-big"></div>
      <div class="win-stats"><div id="winTime" class="time-row"></div><div id="winScore" class="score"></div></div>
      <div id="winChal"></div>
      <div id="unlock" class="unlock" hidden>
        <div class="unlock-row"><img id="unlockImg" alt=""><div id="unlockText"></div></div>
        <div id="unlockPick" class="unlock-pick"></div>
      </div>
      <button id="nextBtn" class="btn resume">
        <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M15 9 L39 24 L15 39 Z"/></svg>
        <span id="nextLabel">לשלב הבא</span>
      </button>
      <div class="pause-grid">
        <button id="winRetryBtn" class="ptile">
          <svg class="ic" viewBox="0 0 48 48"><path class="o" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="i" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="fill" d="M38.6 20 L43 31.5 L30 27.5 Z"/></svg>
          <span>שוב</span>
        </button>
        <button id="winShopBtn" class="ptile">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M9 17 H39 L36 41 H12 Z"/><path class="line" d="M17 17 V13 Q17 6 24 6 Q31 6 31 13 V17"/><circle cx="24" cy="29" r="5" fill="#FFB020" stroke="#0A0614" stroke-width="3"/></svg>
          <span>חנות</span>
        </button>
        <button id="winMapBtn" class="ptile">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill paper" d="M5 12 L17 8 L31 12 L43 8 L43 36 L31 40 L17 36 L5 40 Z"/><path class="line" d="M17 8 V36 M31 12 V40"/><path class="dash" d="M10 33 Q16 22 24 26 T34 19"/><path class="x" d="M33 15 L39 21 M39 15 L33 21"/></svg>
          <span>מפה</span>
        </button>
      </div>
    </div>
  </div>

  <div id="lose" class="overlay" hidden>
    <div class="panel">
      <img id="loseImg" class="sad" alt="">
      <h2>המפלצת נפלה!</h2>
      <button id="retryBtn" class="btn">ננסה שוב!</button>
      <button id="loseMapBtn" class="btn alt">למפה</button>
    </div>
  </div>
</section>

<script src="hydra.js"></script>
<script src="app.js"></script>
</body>
</html>
